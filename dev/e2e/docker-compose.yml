# Local end-to-end environment: WordPress + MariaDB + TranslatePress + mock LLM.
# Usage: dev/e2e/setup.sh, then node dev/e2e/scenarios.mjs
name: aitp-e2e
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40
  mock:
    image: node:22-alpine
    command: ["node", "/app/server.js"]
    volumes:
      - ../mock-llm:/app:ro
    ports:
      - "127.0.0.1:8089:8080"
  wordpress:
    image: wordpress:6.8-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'AITP_ALLOW_INSECURE_ENDPOINT', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
    volumes:
      - wp:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/ai-translator-for-translatepress:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: wordpress:cli-2.11-php8.2
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes:
      - wp:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/ai-translator-for-translatepress:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./:/e2e:ro
    profiles: ["cli"]
volumes:
  db:
  wp:
