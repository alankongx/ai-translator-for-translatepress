# Rehearsal only (docker compose --profile rehearsal up -d hcdn): a front proxy like the test
# site's CDN. It answers with an error (nginx: 502 "upstream sent too big header") when the site
# sends response headers larger than 8 KB; Hostinger's hcdn answered such responses with 500.
server {
	listen 80;
	client_max_body_size 50m;
	location / {
		proxy_pass http://wordpress:80;
		proxy_set_header Host localhost:8088;
		proxy_buffer_size 8k;
		proxy_buffers 16 8k;
		proxy_busy_buffers_size 16k;
		proxy_read_timeout 300s;
	}
}
